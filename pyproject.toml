[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aafton"
version = "0.9.0"
description = "AAF <-> Ableton Live Set conversion with verifiable timecode fidelity"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gabriel Worm"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.10"
dependencies = ["pyaaf2>=1.7.0"]

[project.urls]
Homepage = "https://github.com/ntworm/aafton"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.15.17", "numpy>=2.0,<3", "pyinstaller>=6.22", "pywebview>=6.2"]
desktop = ["pywebview>=6.2"]
formats = ["opentimelineio==0.18.1", "otio-cmx3600-adapter==1.0.0", "otio-fcp-adapter==1.0.0", "otio-fcpx-xml-adapter==1.0.0"]

[project.scripts]
aafton = "aafton.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aafton" = ["templates/*.als"]
"aafton.studio" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["W"]

[tool.ruff.format]
# O quality gate e um snapshot copiado byte a byte: o formatador nao pode
# reescrever o arquivo, e o arquivo e que fica como esta.
exclude = ["scripts/quality_gate.py"]

[tool.ruff.lint.per-file-ignores]
# Espacos no fim de linha que estao dentro de strings: o HTML do Studio e
# amostras de Session Text. Remover muda a resposta HTTP ou a entrada do teste.
"tests/test_session_text.py" = ["W291"]
"tests/unit/test_state_parsing.py" = ["W291"]
